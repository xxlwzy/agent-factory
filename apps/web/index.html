<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Factory</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f7f9; }
    body { margin: 0 auto; max-width: 960px; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.sub { color: #555; margin-top: 0; }
    section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #eee; }
    pre { background: #f0f2f5; padding: 0.75rem; overflow: auto; font-size: 0.8rem; border-radius: 6px; }
    button { cursor: pointer; padding: 0.35rem 0.75rem; border-radius: 4px; border: 1px solid #ccc; background: #fff; font: inherit; }
    button:hover { background: #f0f0f0; }
    button.primary { background: #1a56db; color: #fff; border-color: #1a56db; }
    button.primary:hover { background: #1648c0; }
    button.danger { background: #b00020; color: #fff; border-color: #b00020; }
    button.danger:hover { background: #8f0019; }
    .error { color: #b00020; }
    .chat-layout { display: flex; flex-direction: column; gap: 0.75rem; }
    #chat-messages {
      min-height: 200px; max-height: 420px; overflow-y: auto;
      border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem; background: #fafbfc;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .msg { max-width: 85%; padding: 0.5rem 0.75rem; border-radius: 10px; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #dbeafe; }
    .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; }
    .msg.system { align-self: center; background: #fef3c7; font-size: 0.85rem; color: #92400e; }
    .chat-meta { font-size: 0.8rem; color: #666; }
    #approval-banner {
      display: none; padding: 0.75rem; border-radius: 8px;
      background: #fff7ed; border: 1px solid #fdba74;
    }
    #approval-banner.visible { display: block; }
    #approval-banner p { margin: 0.25rem 0; }
    .approval-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .chat-input-row { display: flex; gap: 0.5rem; align-items: flex-end; }
  </style>
</head>
<body>
  <h1>Agent Factory</h1>
  <p class="sub">多轮对话经路由 Agent 委派；需确认的工具会在此暂停，由您批准或拒绝后继续。</p>

  <section>
    <h2>对话</h2>
    <p class="chat-meta">会话 ID：<code id="session-id">（新会话）</code></p>
    <div class="chat-layout">
      <div id="chat-messages" aria-live="polite"></div>
      <div id="approval-banner" role="region" aria-label="待审批">
        <p><strong>待您确认的工具操作</strong></p>
        <p id="approval-detail"></p>
        <div class="approval-actions">
          <button type="button" class="primary" id="approval-approve">批准</button>
          <button type="button" class="danger" id="approval-deny">拒绝</button>
        </div>
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="2" style="flex:1; font: inherit;" placeholder="输入消息…"></textarea>
        <button type="button" class="primary" id="chat-send">发送</button>
      </div>
    </div>
  </section>

  <section>
    <h2>Agent 目录（可路由）</h2>
    <table id="catalog"><thead><tr><th>Name</th><th>Role</th><th>Description</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Agents（配置文件）</h2>
    <table id="agents"><thead><tr><th>Name</th><th>Config</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Runs</h2>
    <table id="runs"><thead><tr><th>Run ID</th><th>Status</th><th>Report</th><th></th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Skill drafts</h2>
    <table id="drafts"><thead><tr><th>Draft ID</th><th>Status</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="detail" hidden>
    <h2>Run detail: <span id="detail-run-id"></span></h2>
    <pre id="detail-summary"></pre>
    <h3>Trace</h3>
    <pre id="detail-trace"></pre>
    <h3>Report</h3>
    <pre id="detail-report"></pre>
  </section>

  <p id="error" class="error" hidden></p>

  <script>
    let sessionId = null;
    let pendingApproval = null;

    const api = (path) => fetch(path).then((r) => {
      if (!r.ok) throw new Error(`${path} → ${r.status}`);
      return r.json();
    });

    function showError(message) {
      const el = document.getElementById("error");
      el.hidden = false;
      el.textContent = message;
    }

    function clearError() {
      const el = document.getElementById("error");
      el.hidden = true;
      el.textContent = "";
    }

    function appendMessage(role, content) {
      const box = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function setSessionId(id) {
      sessionId = id;
      document.getElementById("session-id").textContent = id || "（新会话）";
    }

    function showApprovalBanner(pending) {
      pendingApproval = pending;
      const banner = document.getElementById("approval-banner");
      if (!pending) {
        banner.classList.remove("visible");
        document.getElementById("approval-detail").textContent = "";
        return;
      }
      banner.classList.add("visible");
      document.getElementById("approval-detail").textContent =
        `${pending.tool}.${pending.operation} → ${pending.target}\n原因：${pending.reason || ""}`;
    }

    async function applyChatResponse(data) {
      if (data.session_id) setSessionId(data.session_id);
      appendMessage("assistant", data.reply);
      if (data.status === "awaiting_confirm" && data.pending_approval) {
        showApprovalBanner(data.pending_approval);
      } else {
        showApprovalBanner(null);
      }
      await loadRuns();
    }

    async function postJson(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      return data;
    }

    async function sendChat() {
      const input = document.getElementById("chat-input");
      const message = input.value.trim();
      if (!message) return;
      clearError();
      appendMessage("user", message);
      input.value = "";
      document.getElementById("chat-send").disabled = true;
      try {
        const body = { message };
        if (sessionId) body.session_id = sessionId;
        const data = await postJson("/api/chat", body);
        await applyChatResponse(data);
      } catch (err) {
        showError(err.message);
      } finally {
        document.getElementById("chat-send").disabled = false;
      }
    }

    async function resolveApproval(approved) {
      if (!pendingApproval?.approval_id) return;
      clearError();
      document.getElementById("approval-approve").disabled = true;
      document.getElementById("approval-deny").disabled = true;
      try {
        const data = await postJson(`/api/approvals/${pendingApproval.approval_id}`, { approved });
        showApprovalBanner(null);
        appendMessage("system", approved ? "您已批准该操作。" : "您已拒绝该操作。");
        await applyChatResponse(data);
      } catch (err) {
        showError(err.message);
      } finally {
        document.getElementById("approval-approve").disabled = false;
        document.getElementById("approval-deny").disabled = false;
      }
    }

    async function loadPendingApprovals() {
      try {
        const pending = await api("/api/approvals/pending");
        if (pending.length > 0 && !pendingApproval) {
          const first = pending[0];
          showApprovalBanner({
            approval_id: first.approval_id,
            tool: first.pending_tool.tool,
            operation: first.pending_tool.operation,
            target: first.pending_tool.target,
            reason: first.reason,
          });
          if (first.session_id) setSessionId(first.session_id);
        }
      } catch (_) { /* ignore on fresh workspace */ }
    }

    async function loadAgents() {
      const agents = await api("/api/agents");
      const tbody = document.querySelector("#agents tbody");
      tbody.innerHTML = agents.map((a) =>
        `<tr><td>${a.name}</td><td><code>${a.path}</code></td></tr>`
      ).join("");
    }

    async function loadRuns() {
      const runs = await api("/api/runs");
      const tbody = document.querySelector("#runs tbody");
      tbody.innerHTML = runs.map((r) =>
        `<tr>
          <td><code>${r.run_id}</code></td>
          <td>${r.status}</td>
          <td>${r.has_report ? "yes" : "no"}</td>
          <td><button type="button" data-run="${r.run_id}">View</button></td>
        </tr>`
      ).join("");
      tbody.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => showRun(btn.dataset.run));
      });
    }

    async function loadDrafts() {
      const drafts = await api("/api/skills/drafts");
      const tbody = document.querySelector("#drafts tbody");
      tbody.innerHTML = drafts.map((d) =>
        `<tr><td><code>${d.draft_id}</code></td><td>${d.status}</td></tr>`
      ).join("");
    }

    async function showRun(runId) {
      const meta = await api(`/api/runs/${runId}`);
      const trace = await api(`/api/runs/${runId}/trace`);
      document.getElementById("detail").hidden = false;
      document.getElementById("detail-run-id").textContent = runId;
      document.getElementById("detail-summary").textContent = meta.summary || "(no summary)";
      document.getElementById("detail-trace").textContent = JSON.stringify(trace, null, 2);
      const reportEl = document.getElementById("detail-report");
      if (meta.artifacts && meta.artifacts.includes("report.md")) {
        const res = await fetch(`/api/runs/${runId}/artifacts/report.md`);
        reportEl.textContent = res.ok ? await res.text() : "(report not readable)";
      } else {
        reportEl.textContent = "(no report)";
      }
    }

    async function loadCatalog() {
      const entries = await api("/api/agents/catalog");
      const tbody = document.querySelector("#catalog tbody");
      tbody.innerHTML = entries.map((e) =>
        `<tr><td><code>${e.name}</code></td><td>${e.role}</td><td>${e.description}</td></tr>`
      ).join("");
    }

    async function init() {
      document.getElementById("chat-send").addEventListener("click", sendChat);
      document.getElementById("chat-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendChat();
        }
      });
      document.getElementById("approval-approve").addEventListener("click", () => resolveApproval(true));
      document.getElementById("approval-deny").addEventListener("click", () => resolveApproval(false));
      try {
        await Promise.all([loadCatalog(), loadAgents(), loadRuns(), loadDrafts(), loadPendingApprovals()]);
      } catch (err) {
        showError(err.message);
      }
    }
    init();
  </script>
</body>
</html>
